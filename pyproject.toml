[project]
name = "censur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "better-profanity>=0.7.0",
    "fastapi[all]>=0.162.0",
    "psycopg2>=2.9.13",
    "pydantic-settings>=2.16.1",
    "pydub>=0.25.1",
    "scalar-fastapi>=1.9.1",
    "sqlmodel>=0.0.48",
    "whisperx>=3.8.6",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'
